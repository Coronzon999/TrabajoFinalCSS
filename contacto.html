            <h1 class="formulario__titulo">Contactanos</h1>
            <div>
                <section class="row">
                    <section class="col-xs-12 col-sm-6 col-md-6">
                        <label for="">Nombre</label>  <br>
                        <input type="text" placeholder=" Introduzca su nombre">
                    </section>
                    <section class="col-xs-12 col-sm-6 col-md-6">
                        <label for="">Apellidos</label>  <br>
                        <input type="text" placeholder=" Introduzca sus apellidos"> <br><br>    
                    </section>
                </section>
                        <label for="">Telefono</label> <br>
                        <input type="tel" placeholder=" Introduzca su número de telefono"> <br><br> 
                        <label for="">Correo electronico</label> <br>
                        <input type="email" placeholder=" Introduzca su correo electronico"> <br><br>
                        <label for="">Asunto</label> <br>
                        <input type="text" placeholder=" Consulte su asunto aqui"> <br><br>
                <label for="">Mensaje</label> <br>
                <textarea class="formulario__motivo" name="" id="" placeholder=" Escriba su mensaje aqui"></textarea>
                <br>br
                <button class="formulario__boton">Enviar</button>
            </div>  
        </form>
    </main>
