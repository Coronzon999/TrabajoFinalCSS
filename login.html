<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Aurora Creative</title>
    
    <!-- FAVICON -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

    <!-- LIBRERIA DE FUENTES (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- FONTAWESOME ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header id="header">
        <nav class="menu">
            <div class="menu__logo">
                <a href="index.html">
                    <img src="img/logo.jpg" alt="Aurora Creative Logo" class="img-fluid menu__img-logo" />
                </a>
                <a href="#" class="menu__btn-menu" id="btn-menu">
                    <i class="fa-solid fa-bars menu__icono-menu"></i>
                </a>
            </div>
            <div class="menu__enlaces" id="enlaces">
                <a href="index.html">INICIO</a>
                <a href="cursos.html">PRODUCTOS</a>
                <a href="ofertas.html">OFERTAS</a>
                <a href="nosotros.html">NOSOTROS</a>
                <a href="contactos.html">CONTACTOS</a>
                <a href="login.html">LOGIN</a>
            </div>
        </nav>
    </header>
    <!-- FIN DE MENÚ -->

    <!-- SECCIÓN CONTENEDOR LOGIN -->
    <main class="contenedor-login">
        <!-- SECCIÓN IZQUIERDA: FORMULARIO -->
        <div class="login-izquierda">
            <div class="cabecera-login">
               
                <h2>Iniciar Sesión</h2>
                <p class="subtitulo-login">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>

            <form class="formulario-login">
                <div class="grupo-formulario">
                    <label for="correo">Correo Electrónico</label>
                    <div class="contenedor-input">
                        <input type="email" id="correo" placeholder="tu@ejemplo.com" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <div class="contenedor-input">
                        <input type="password" id="contrasena" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye" id="alternarContrasena"></i>
                    </div>
                </div>

                <div class="opciones-formulario">
                    <label class="recordarme">
                        <input type="checkbox">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="olvide-contrasena">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="boton-login">Ingresar</button>
            </form>

            <footer class="pie-login">
                <p>&copy; 2026 Aurora Creative. Todos los derechos reservados.</p>
                <div class="enlaces-pie">
                    <a href="#">Términos de Servicio</a> | <a href="#">Política de Privacidad</a>
                </div>
            </footer>
        </div>

        <!-- SECCIÓN DERECHA: BANNER GAMING -->
        <div class="login-derecha">
            <img src="img/Gemini_Generated_Image_99xwis99xwis99xw.jpg" alt="Aurora Creative PC Banner" class="imagen-banner">
            <div class="superposicion-banner"></div>
        </div>
    </main>

    <!-- SCRIPT DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
