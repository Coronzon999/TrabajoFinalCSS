<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Aurora Creative</title>
    
    <!-- FAVICON -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

    <!-- FUENTE POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- FONTAWESOME ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header id="header">
        <nav class="menu">
            <div class="menu__logo">
                <a href="index.html">
                    <img src="img/logo.jpg" alt="Aurora Creative Logo" class="img-fluid menu__img-logo" />
                </a>
                <a href="#" class="menu__btn-menu" id="btn-menu">
                    <i class="fa-solid fa-bars menu__icono-menu"></i>
                </a>
            </div>
            <div class="menu__enlaces" id="enlaces">
                <a href="index.html">INICIO</a>
                <a href="Productos.html">PRODUCTOS</a>
                <a href="ofertas.html">OFERTAS</a>
                <a href="nosotros.html">NOSOTROS</a>
                <a href="contactos.html">CONTACTOS</a>
                <a href="login.html">LOGIN</a>
            </div>
        </nav>
    </header>
    <!-- FIN DE MENÚ -->

    <!-- SECCIÓN CONTENEDOR CENTRADO (ESTRUCTURA TARJETA) -->
    <main class="contenedor-centrado">
        <div class="tarjeta-registro">
            
            <!-- CABECERA DE LA TARJETA -->
            <div class="cabecera-registro">
                <h2>Crear Cuenta</h2>
                <p class="subtitulo-registro">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <form class="formulario-registro" action="login.html" method="GET">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre Completo</label>
                    <div class="contenedor-input">
                        <input type="text" id="nombre" placeholder="Tu Nombre y Apellido" required>
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="correo">Correo Electrónico</label>
                    <div class="contenedor-input">
                        <input type="email" id="correo" placeholder="tu@ejemplo.com" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <div class="contenedor-input">
                        <input type="password" id="contrasena" placeholder="Mínimo 8 caracteres" required>
                        <i class="fa-regular fa-eye" id="alternarContrasena"></i>
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar-contrasena">Confirmar Contraseña</label>
                    <div class="contenedor-input">
                        <input type="password" id="confirmar-contrasena" placeholder="Repite tu contraseña" required>
                        <i class="fa-regular fa-eye" id="alternarConfirmar"></i>
                    </div>
                </div>

                <div class="opciones-formulario">
                    <label class="terminos">
                        <input type="checkbox" required>
                        <span>Acepto los <a href="#">Términos y Condiciones</a></span>
                    </label>
                </div>

                <button type="submit" class="boton-registro">REGISTRARSE
                    <a href="login.html">

                    </a>
                </button>
            </form>

            <!-- PIE DE LA TARJETA -->
            <footer class="pie-registro">
                <p>&copy; 2026 Aurora Creative. Todos los derechos reservados.</p>
                <div class="enlaces-pie">
                    <a href="#">Términos de Servicio</a> | <a href="#">Política de Privacidad</a>
                </div>
            </footer>

        </div>
    </main>

    <!-- SCRIPT DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
